# Frontier Ant Homeostatic Curriculum
#
# Calibrated for meaningful thermal pressure where self-regulation matters.
# heat_move=0.005 + cooling_rate=0.010 means running fast DOES overheat,
# forcing the agent to learn thermal management alongside locomotion.

stages:
  - name: easy
    steps: 200000
    cooling_rate: 0.08
    t_fatal: 3.0
    action_heat_gain: 0.002
    heat_move: 0.002

  - name: medium
    steps: 200000
    cooling_rate: 0.03
    t_fatal: 1.8
    action_heat_gain: 0.004
    heat_move: 0.004

  - name: full
    steps: 2000000
    cooling_rate: 0.010
    t_fatal: 1.2
    action_heat_gain: 0.006
    heat_move: 0.005
