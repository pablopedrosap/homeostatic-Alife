[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeostatic-colony"
version = "0.1.0"
description = "ALife experiment: homeostatic control vs extrinsic reward RL"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "stable-baselines3>=2.1.0",
    "matplotlib>=3.7.0",
    "imageio[ffmpeg]>=2.31.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
include = ["homeostatic_colony*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
